version: 2

models:
  - name: v_season_races_summary
    description: "Serving mart for season races listing and grand prix overview, consolidating round information, circuits, winning drivers, teams, laps completed, and official times."
    columns:
      - name: year
        description: "Championship season year"
        data_tests:
          - not_null
      - name: round_number
        description: "Grand Prix round number in championship"
        data_tests:
          - not_null
      - name: official_event_name
        description: "Official Grand Prix name"
      - name: country
        description: "Host country of the circuit"
      - name: race_status
        description: "Status of the race: Completed or Scheduled"

  - name: v_sessions_summary
    description: "Analytical mart containing the comprehensive results of every session (Practice, Qualifying, Sprint, Race), including calculated gaps to leader, intervals to car ahead, pit stops, and position deltas."
    columns:
      - name: session_sk
        description: "Surrogate key referencing the session in dim_sessions"
        data_tests:
          - not_null

      - name: year
        description: "Championship season year"
        data_tests:
          - not_null

      - name: round_number
        description: "Grand Prix round number in the championship"
        data_tests:
          - not_null

      - name: session_name
        description: "Session designation (Practice 1, Practice 2, Practice 3, Qualifying, Sprint, Race)"
        data_tests:
          - not_null

      - name: driver_id
        description: "Canonical driver identifier"
        data_tests:
          - not_null

      - name: driver_number
        description: "Permanent or allocated racing number of the driver"

      - name: driver_full_name
        description: "Full name of the driver"
        data_tests:
          - not_null

      - name: driver_headshot_url
        description: "Official Formula 1 driver headshot image URL"

      - name: team_name
        description: "Full constructor team name"

      - name: team_color
        description: "Official team color in hexadecimal format (e.g., #E80020)"

      - name: finishing_position
        description: "Classified finishing position in the session"

      - name: grid_position
        description: "Starting position on the grid"

      - name: delta_position
        description: "Net position change between grid and finish (positive indicates positions gained)"

      - name: points
        description: "Championship points scored in the session"

      - name: stops
        description: "Calculated number of pit stops based on session stints"

      - name: gap_to_leader
        description: "Formatted time gap or status relative to session leader (e.g. 'Leader', '+1.234s', '+1 Lap(s)', 'DNF')"

      - name: interval_to_car_ahead
        description: "Formatted time interval relative to the car immediately ahead"

      - name: best_lap
        description: "Driver's fastest lap time in the session (formatted as MM:SS.mmm)"

      - name: status
        description: "Official classification status (Finished, +1 Lap, Collision, Engine, etc.)"

      - name: laps_completed
        description: "Total number of laps completed by the driver"


  - name: v_driver_standings
    description: "Championship drivers' standings aggregating cumulative points, wins, and podiums across Race and Sprint sessions for each season."
    columns:
      - name: year
        description: "Championship season year"
        data_tests:
          - not_null

      - name: driver_headshot_url
        description: "Official driver portrait URL"

      - name: driver_full_name
        description: "Full name of the driver"
        data_tests:
          - not_null

      - name: driver_nationality
        description: "Driver's nationality country code (e.g. GBR, NED, BRA)"

      - name: sprint_wins
        description: "Total number of Sprint race victories in the season"

      - name: race_wins
        description: "Total number of Grand Prix main race victories in the season"

      - name: total_wins
        description: "Combined total victories (Grand Prix + Sprint)"

      - name: sprint_podiums
        description: "Total number of top-3 finishes in Sprint sessions"

      - name: race_podiums
        description: "Total number of top-3 podium finishes in Grand Prix races"

      - name: total_podiums
        description: "Combined total podium finishes (Grand Prix + Sprint)"

      - name: sprint_points
        description: "Total points earned exclusively in Sprint sessions"

      - name: race_points
        description: "Total points earned in Grand Prix main races"

      - name: total_points
        description: "Cumulative championship points scored across the full season"
        data_tests:
          - not_null

      - name: championship_position
        description: "Official drivers' championship standing position (ranked by points, wins, and podiums)"
        data_tests:
          - not_null


  - name: v_constructor_standings
    description: "Championship constructors' standings aggregating cumulative points, race/sprint wins, and podiums per team."
    columns:
      - name: year
        description: "Championship season year"
        data_tests:
          - not_null

      - name: team_name
        description: "Full constructor team name"
        data_tests:
          - not_null

      - name: team_color
        description: "Official hexadecimal hex color code of the team"

      - name: sprint_wins
        description: "Total Sprint race victories won by the team's drivers"

      - name: race_wins
        description: "Total Grand Prix race victories won by the team's drivers"

      - name: total_wins
        description: "Combined victories (Grand Prix + Sprint)"

      - name: sprint_podiums
        description: "Total Sprint podium finishes achieved by the team"

      - name: race_podiums
        description: "Total Grand Prix podium finishes achieved by the team"

      - name: total_podiums
        description: "Combined podium finishes across the season"

      - name: sprint_points
        description: "Total points earned by the constructor in Sprint sessions"

      - name: race_points
        description: "Total points earned by the constructor in Grand Prix races"

      - name: total_points
        description: "Cumulative championship points scored by the constructor"
        data_tests:
          - not_null

      - name: championship_position
        description: "Official constructors' championship standing position"
        data_tests:
          - not_null


  - name: v_cumulative_drivers_points
    description: "Time-series round-by-round points accumulation for drivers, supporting dynamic slider filtering and progression charts."
    columns:
      - name: year
        description: "Championship season year"
        data_tests:
          - not_null

      - name: round_number
        description: "Championship round number"
        data_tests:
          - not_null

      - name: country
        description: "Country where the event took place"

      - name: location
        description: "City or region of the circuit"

      - name: official_event_name
        description: "Official Grand Prix event title"

      - name: event_name
        description: "Common Grand Prix name"

      - name: session_name
        description: "Session designation (Race or Sprint)"

      - name: driver_full_name
        description: "Full name of the driver"
        data_tests:
          - not_null

      - name: team_name
        description: "Team name representing the driver"

      - name: team_color
        description: "Hexadecimal team color"

      - name: finishing_position
        description: "Finishing position in this specific session"

      - name: is_race_win
        description: "Flag (1/0) indicating if the driver won this Grand Prix race"

      - name: is_sprint_win
        description: "Flag (1/0) indicating if the driver won this Sprint race"

      - name: is_race_podium
        description: "Flag (1/0) indicating a top-3 podium finish in this Grand Prix race"

      - name: is_sprint_podium
        description: "Flag (1/0) indicating a top-3 finish in this Sprint race"

      - name: is_win
        description: "Flag (1/0) indicating a victory in any session"

      - name: is_podium
        description: "Flag (1/0) indicating a podium in any session"

      - name: points
        description: "Points scored by the driver in this round/session"

      - name: cumulative_driver_points
        description: "Running cumulative points total up to this round"
        data_tests:
          - not_null


  - name: v_cumulative_teams_points
    description: "Time-series round-by-round points accumulation for constructors, supporting dynamic season progression charts."
    columns:
      - name: year
        description: "Championship season year"
        data_tests:
          - not_null

      - name: round_number
        description: "Championship round number"
        data_tests:
          - not_null

      - name: country
        description: "Country where the event took place"

      - name: location
        description: "City or region of the circuit"

      - name: official_event_name
        description: "Official Grand Prix event title"

      - name: event_name
        description: "Common Grand Prix name"

      - name: session_name
        description: "Session designation (Race or Sprint)"

      - name: team_name
        description: "Full constructor team name"
        data_tests:
          - not_null

      - name: team_color
        description: "Hexadecimal team color"

      - name: race_wins
        description: "Count of Grand Prix race victories won by the constructor in this session"

      - name: sprint_wins
        description: "Count of Sprint victories won by the constructor in this session"

      - name: race_podiums
        description: "Count of Grand Prix podium finishes achieved by the constructor in this session"

      - name: sprint_podiums
        description: "Count of Sprint podium finishes achieved by the constructor in this session"

      - name: wins
        description: "Total session victories won by the constructor"

      - name: podiums
        description: "Total session podium finishes achieved by the constructor"

      - name: points
        description: "Total points scored by the constructor in this round/session"

      - name: cumulative_team_points
        description: "Running cumulative points total for the constructor up to this round"
        data_tests:
          - not_null


  - name: v_ideal_lap
    description: "Theoretical ideal lap analysis combining each driver's fastest individual sectors (S1, S2, S3) and comparing against their actual best lap."
    columns:
      - name: year
        description: "Championship season year"
        data_tests:
          - not_null

      - name: round_number
        description: "Grand Prix round number"
        data_tests:
          - not_null

      - name: official_event_name
        description: "Official Grand Prix event title"

      - name: session_number
        description: "Chronological session number (1 to 5)"

      - name: session_name
        description: "Session designation"

      - name: driver_full_name
        description: "Driver's full name"
        data_tests:
          - not_null

      - name: team_name
        description: "Constructor team name"

      - name: sector_1
        description: "Fastest Sector 1 time achieved by the driver in the session (formatted MM:SS.mmm)"

      - name: sector_2
        description: "Fastest Sector 2 time achieved by the driver in the session (formatted MM:SS.mmm)"

      - name: sector_3
        description: "Fastest Sector 3 time achieved by the driver in the session (formatted MM:SS.mmm)"

      - name: lap_time
        description: "Actual fastest complete lap time recorded by the driver in the session (formatted MM:SS.mmm)"

      - name: delta_ideal_lap
        description: "Time difference between actual best lap and the theoretical ideal lap (sum of best S1 + S2 + S3)"


  - name: v_lap_by_lap
    description: "Lap-by-lap telemetry and progression data for race sessions, tracking sector times, tyre life, and track conditions."
    columns:
      - name: year
        description: "Championship season year"
        data_tests:
          - not_null

      - name: round_number
        description: "Grand Prix round number"
        data_tests:
          - not_null

      - name: official_event_name
        description: "Official Grand Prix event title"

      - name: session_name
        description: "Session designation (Race or Sprint)"

      - name: driver_full_name
        description: "Full name of the driver"
        data_tests:
          - not_null

      - name: driver_abbreviation
        description: "Three-letter driver code"

      - name: team_name
        description: "Constructor team name"

      - name: team_color
        description: "Hexadecimal team color"

      - name: lap_number
        description: "Lap sequence number in the session"
        data_tests:
          - not_null

      - name: sector_1_time_seconds
        description: "Sector 1 time in decimal seconds"

      - name: sector_2_time_seconds
        description: "Sector 2 time in decimal seconds"

      - name: sector_3_time_seconds
        description: "Sector 3 time in decimal seconds"

      - name: lap_time_seconds
        description: "Lap time in decimal seconds"

      - name: lap_time
        description: "Formatted lap time string (MM:SS.mmm)"

      - name: compound
        description: "Tyre compound used during the lap (SOFT, MEDIUM, HARD, etc.)"

      - name: tyre_life
        description: "Age in laps of the current tyre set"

      - name: track_status_description
        description: "Description of track flags active during the lap"

      - name: position
        description: "Running race position at the conclusion of the lap"


  - name: v_max_speed
    description: "Maximum recorded speeds per driver across all session radar measurement points (Speed Trap, Intermediate 1, Intermediate 2, Finish Line)."
    columns:
      - name: year
        description: "Championship season year"
        data_tests:
          - not_null

      - name: round_number
        description: "Grand Prix round number"
        data_tests:
          - not_null

      - name: official_event_name
        description: "Official Grand Prix event title"

      - name: session_name
        description: "Session designation"

      - name: driver_full_name
        description: "Full name of the driver"
        data_tests:
          - not_null

      - name: team_name
        description: "Constructor team name"

      - name: max_speed_trap
        description: "Top speed recorded at the official Speed Trap sensor (km/h)"

      - name: max_speed_i1
        description: "Top speed recorded at Intermediate Sector 1 sensor (km/h)"

      - name: max_speed_i2
        description: "Top speed recorded at Intermediate Sector 2 sensor (km/h)"

      - name: max_speed_fl
        description: "Top speed recorded crossing the Finish Line (km/h)"


  - name: v_race_pace
    description: "Race pace analysis calculating average clean lap times and pace standard deviation per driver, filtering out pit in/out laps and Safety Car periods."
    columns:
      - name: year
        description: "Championship season year"
        data_tests:
          - not_null

      - name: round_number
        description: "Grand Prix round number"
        data_tests:
          - not_null

      - name: official_event_name
        description: "Official Grand Prix event title"

      - name: session_name
        description: "Session designation (Race or Sprint)"

      - name: driver_full_name
        description: "Full name of the driver"
        data_tests:
          - not_null

      - name: team_name
        description: "Constructor team name"

      - name: avg_lap_time_seconds
        description: "Arithmetic mean lap time in decimal seconds across clean racing laps"

      - name: lap_pace
        description: "Formatted average lap pace (MM:SS.mmm)"

      - name: pace_stddev
        description: "Standard deviation of lap times, reflecting stint consistency"


  - name: v_tyre_strategy
    description: "Tyre stint strategy analysis detailing compound usage, stint duration in laps, average pace per stint, and pit stops under neutralization periods."
    columns:
      - name: year
        description: "Championship season year"
        data_tests:
          - not_null

      - name: round_number
        description: "Grand Prix round number"
        data_tests:
          - not_null

      - name: official_event_name
        description: "Official Grand Prix event title"

      - name: session_name
        description: "Session designation (Race or Sprint)"

      - name: driver_full_name
        description: "Full name of the driver"
        data_tests:
          - not_null

      - name: team_name
        description: "Constructor team name"

      - name: stint
        description: "Stint sequence number for the driver (1, 2, 3, etc.)"

      - name: compound
        description: "Tyre compound fitted during this stint"

      - name: lap_start
        description: "First lap of the stint"

      - name: lap_end
        description: "Final lap of the stint"

      - name: stint_laps_completed
        description: "Total number of laps completed on this tyre set"

      - name: stint_avg_lap_time
        description: "Formatted average lap time during this stint (MM:SS.mmm)"

      - name: pit_under_safety_car
        description: "Boolean indicating if the pit stop ending this stint occurred under Full Safety Car"

      - name: pit_under_vsc
        description: "Boolean indicating if the pit stop occurred under Virtual Safety Car"

      - name: pit_under_red_flag
        description: "Boolean indicating if tyres were changed during a Red Flag stoppage"


  - name: v_season_matrix
    description: "Official Formula 1 season results matrix mart modeled after the Wikipedia championship grid, consolidating every round's outcome per driver, pole positions, fastest laps, sprints, and official colour-coded categories."
    columns:
      - name: year
        description: "Championship season year"
        data_tests:
          - not_null

      - name: round_number
        description: "Grand Prix round number"
        data_tests:
          - not_null

      - name: circuit_short_code
        description: "Standardized 3-letter circuit abbreviation (e.g. BHR, MON, INT)"
        data_tests:
          - not_null

      - name: driver_id
        description: "Canonical driver identifier"
        data_tests:
          - not_null

      - name: driver_full_name
        description: "Driver full name"
        data_tests:
          - not_null

      - name: team_name
        description: "Constructor team name"
        data_tests:
          - not_null

      - name: championship_position
        description: "Championship ranking position of the driver"

      - name: total_driver_points
        description: "Total points accumulated by the driver in the season"

      - name: result_code
        description: "Display code for the round (1, 2, Ret, DNS, DSQ, 17†, etc.)"

      - name: result_category
        description: "Color-coded category for styling (p1, p2, p3, points, no_points, retired, dns, dsq, scheduled, not_participated)"

  - name: v_driver_season_summary
    description: "Serving mart consolidating season-by-season performance metrics per driver: race/sprint wins, podiums, poles, fastest laps, total points, best results, DNFs, competitive sessions, and official championship position."
    columns:
      - name: year
        description: "Championship season year"
        data_tests:
          - not_null
      - name: driver_id
        description: "Canonical driver identifier"
        data_tests:
          - not_null
      - name: broadcast_name
        description: "Standard TV broadcast display name"
      - name: driver_abbreviation
        description: "Three-letter driver code (e.g. VER, HAM, ALO)"
      - name: driver_full_name
        description: "Driver full name"
      - name: driver_nationality
        description: "Three-letter country code of driver nationality"
      - name: driver_headshot_url
        description: "Official Formula 1 driver portrait image URL"
      - name: total_gps
        description: "Total Grand Prix main races entered by the driver in the season"
      - name: competitive_gps
        description: "Total events where the driver took part in competitive sessions (Race, Sprint, Qualifying, or Sprint Shootout)"
      - name: race_wins
        description: "Total Grand Prix race victories won by the driver in the season"
      - name: sprint_wins
        description: "Total Sprint race victories won by the driver in the season"
      - name: race_poles
        description: "Total Grand Prix pole positions achieved by the driver in the season"
      - name: sprint_poles
        description: "Total Sprint pole positions achieved by the driver in the season"
      - name: total_wins
        description: "Combined race and sprint victories won by the driver in the season"
      - name: poles_to_win
        description: "Count of Grand Prix races won starting from pole position in the season"
      - name: race_podiums
        description: "Total Grand Prix podium finishes (P1-P3) in the season"
      - name: sprint_podiums
        description: "Total Sprint podium finishes (P1-P3) in the season"
      - name: total_podiums
        description: "Combined race and sprint podium finishes in the season"
      - name: q2_appearences
        description: "Count of qualifying sessions where driver advanced to Q2"
      - name: q3_appearences
        description: "Count of qualifying sessions where driver reached top-10 shootout Q3"
      - name: race_points
        description: "Total championship points earned in Grand Prix main races"
      - name: sprint_points
        description: "Total championship points earned in Sprint races"
      - name: total_points
        description: "Cumulative championship points scored across the full season"
      - name: best_finish_position
        description: "Best finishing position achieved in a Grand Prix race during the season"
      - name: best_grid_position
        description: "Best starting grid position in a Grand Prix race during the season"
      - name: total_dnfs
        description: "Total race retirements / did not finish instances in the season"
      - name: fastest_laps
        description: "Total fastest race laps recorded by the driver during the season"
      - name: pole_to_win_rate
        description: "Conversion rate percentage of pole positions to race wins"
      - name: is_season_completed
        description: "Boolean indicating whether all scheduled rounds in the season have been completed"
      - name: championship_position
        description: "Official championship standing position ranked by total points, race wins, and podiums"
      - name: team_name
        description: "Constructor team name the driver raced for at the end of the season"
      - name: team_color
        description: "Hexadecimal color code of the driver's team"

  - name: v_driver_career_summary
    description: "Serving mart consolidating all-time career statistics and historical rankings per driver: total GPs, seasons active, world championship titles, race/sprint wins, podiums, poles, fastest laps, points, and DNFs."
    columns:
      - name: driver_id
        description: "Canonical driver identifier"
        data_tests:
          - not_null
      - name: broadcast_name
        description: "Standard TV broadcast display name"
      - name: driver_abbreviation
        description: "Three-letter driver code"
      - name: driver_full_name
        description: "Driver full name"
      - name: driver_nationality
        description: "Three-letter country code of driver nationality"
      - name: driver_headshot_url
        description: "Official Formula 1 driver portrait image URL"
      - name: total_gps
        description: "Total Formula 1 Grand Prix races entered across career"
      - name: total_seasons
        description: "Total distinct Formula 1 seasons participated in"
      - name: first_season
        description: "First Formula 1 season year the driver entered"
      - name: last_season
        description: "Most recent Formula 1 season year the driver entered"
      - name: active_season_competitive_gps
        description: "Number of competitive Grand Prix events the driver participated in during the active season"
      - name: total_world_championships
        description: "Total Formula 1 World Drivers Championship titles won across completed seasons"
      - name: race_wins
        description: "Total career Grand Prix race victories"
      - name: sprint_wins
        description: "Total career Sprint race victories"
      - name: total_wins
        description: "Combined career victories across Grand Prix and Sprint sessions"
      - name: total_poles_to_win
        description: "Career total races won starting from pole position"
      - name: race_poles
        description: "Total career Grand Prix pole positions"
      - name: sprint_poles
        description: "Total career Sprint pole positions"
      - name: pole_to_win_rate
        description: "All-time career conversion rate percentage from pole position to victory"
      - name: race_podiums
        description: "Total career Grand Prix podium finishes"
      - name: sprint_podiums
        description: "Total career Sprint podium finishes"
      - name: total_podiums
        description: "Combined career podium finishes across Grand Prix and Sprint sessions"
      - name: total_q2_appearences
        description: "Total career appearances in Qualifying Q2"
      - name: total_q3_appearences
        description: "Total career appearances in Qualifying top-10 Q3 shootout"
      - name: total_fastest_laps
        description: "Total career official fastest race laps"
      - name: race_points
        description: "Total career points scored in Grand Prix main races"
      - name: sprint_points
        description: "Total career points scored in Sprint sessions"
      - name: total_points
        description: "Cumulative all-time career championship points scored"
      - name: best_finish_position
        description: "Highest career finishing position in a Grand Prix race"
      - name: best_grid_position
        description: "Highest career starting grid position in a Grand Prix race"
      - name: total_dnfs
        description: "Total career race retirements / did not finish instances"
      - name: is_active
        description: "Boolean flag indicating whether the driver belongs to the active competitive grid"
      - name: rank_world_championships
        description: "All-time historical rank by World Championship titles"
      - name: rank_race_wins
        description: "All-time official historical rank by Grand Prix victories (canonical F1 record)"
      - name: rank_sprint_wins
        description: "All-time historical rank by Sprint race victories"
      - name: rank_total_wins
        description: "All-time historical rank by combined victories (Grand Prix + Sprint)"
      - name: rank_poles
        description: "All-time historical rank by Grand Prix pole positions"
      - name: rank_race_podiums
        description: "All-time official historical rank by Grand Prix podium finishes (canonical F1 record)"
      - name: rank_sprint_podiums
        description: "All-time historical rank by Sprint podium finishes"
      - name: rank_total_podiums
        description: "All-time historical rank by combined podium finishes"
      - name: rank_gps
        description: "All-time historical rank by Grand Prix race starts"
      - name: rank_seasons
        description: "All-time historical rank by total seasons active in Formula 1"
      - name: rank_q3_appearences
        description: "All-time historical rank by Q3 shootout appearances"
      - name: rank_q2_appearences
        description: "All-time historical rank by Q2 appearances"
      - name: rank_points
        description: "All-time historical rank by cumulative championship points"

