        description: "Total career Grand Prix pole positions"
      - name: sprint_poles
        description: "Total career Sprint pole positions"
      - name: pole_to_win_rate
        description: "All-time career conversion rate percentage from pole position to victory"
      - name: race_podiums
        description: "Total career Grand Prix podium finishes"
      - name: sprint_podiums
        description: "Total career Sprint podium finishes"
      - name: total_podiums
        description: "Combined career podium finishes across Grand Prix and Sprint sessions"
      - name: total_q2_appearences
        description: "Total career appearances in Qualifying Q2"
      - name: total_q3_appearences
        description: "Total career appearances in Qualifying top-10 Q3 shootout"
      - name: total_fastest_laps
        description: "Total career official fastest race laps"
      - name: race_points
        description: "Total career points scored in Grand Prix main races"
      - name: sprint_points
        description: "Total career points scored in Sprint sessions"
      - name: total_points
        description: "Cumulative all-time career championship points scored"
      - name: best_finish_position
        description: "Highest career finishing position in a Grand Prix race"
      - name: best_grid_position
        description: "Highest career starting grid position in a Grand Prix race"
      - name: total_dnfs
        description: "Total career race retirements / did not finish instances"
      - name: is_active
        description: "Boolean flag indicating whether the driver belongs to the active competitive grid"
      - name: rank_world_championships
        description: "All-time historical rank by World Championship titles"
      - name: rank_race_wins
        description: "All-time official historical rank by Grand Prix victories (canonical F1 record)"
      - name: rank_sprint_wins
        description: "All-time historical rank by Sprint race victories"
      - name: rank_total_wins
        description: "All-time historical rank by combined victories (Grand Prix + Sprint)"
      - name: rank_poles
        description: "All-time historical rank by Grand Prix pole positions"
      - name: rank_race_podiums
        description: "All-time official historical rank by Grand Prix podium finishes (canonical F1 record)"
      - name: rank_sprint_podiums
        description: "All-time historical rank by Sprint podium finishes"
      - name: rank_total_podiums
        description: "All-time historical rank by combined podium finishes"
      - name: rank_gps
        description: "All-time historical rank by Grand Prix race starts"
      - name: rank_seasons
        description: "All-time historical rank by total seasons active in Formula 1"
      - name: rank_q3_appearences
        description: "All-time historical rank by Q3 shootout appearances"
      - name: rank_q2_appearences
        description: "All-time historical rank by Q2 appearances"
      - name: rank_points
        description: "All-time historical rank by cumulative championship points"

  - name: v_constructor_season_summary
    description: "Serving mart consolidating season-by-season statistics and metrics per constructor: total GPs, competitive sessions, race/sprint wins, poles, podiums, 1-2 finishes, front row lockouts, double podiums/points, Q2/Q3 appearances, fastest laps, DNFs, championship position, and driver lineups."
    columns:
      - name: year
        description: "Championship season year"
        data_tests:
          - not_null
      - name: team_id
        description: "Canonical constructor identifier"
        data_tests:
          - not_null
      - name: team_name
        description: "Full constructor team name"
      - name: team_color
        description: "Official team color in hexadecimal format"
      - name: total_gps
        description: "Total Grand Prix races entered by the team in the season"
      - name: competitive_gps
        description: "Count of events with participation in competitive sessions (Race, Sprint, Qualifying)"
      - name: race_wins
        description: "Total Grand Prix race victories won by the constructor in the season"
      - name: sprint_wins
        description: "Total Sprint race victories won by the constructor in the season"
      - name: total_wins
        description: "Combined Grand Prix and Sprint victories won by the constructor in the season"
      - name: race_poles
        description: "Total Grand Prix pole positions achieved by the constructor in the season"
      - name: sprint_poles
        description: "Total Sprint pole positions achieved by the constructor in the season"
      - name: poles_to_win
        description: "Count of Grand Prix races won starting from pole position in the season"
      - name: race_podiums
        description: "Total Grand Prix podium finishes (P1-P3) in the season"
      - name: sprint_podiums
        description: "Total Sprint podium finishes (P1-P3) in the season"
      - name: total_podiums
        description: "Combined race and sprint podium finishes in the season"
      - name: q2_appearences
        description: "Count of qualifying sessions where at least one team car advanced to Q2"
      - name: q3_appearences
        description: "Count of qualifying sessions where at least one team car reached top-10 shootout Q3"
      - name: race_points
        description: "Total championship points earned in Grand Prix main races"
      - name: sprint_points
        description: "Total championship points earned in Sprint races"
