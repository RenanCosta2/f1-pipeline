version: 2

models:
  - name: stg_schedule
    description: "F1 Schedules cleaned, typed, and enriched with canonical circuit overrides."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: unique_official_gp_round_per_year
          combination_of_columns:
            - year
            - round_number
          config:
            where: "round_number > 0"
      - dbt_utils.unique_combination_of_columns:
          name: unique_event_schedule
          combination_of_columns:
            - year
            - round_number
            - event_name
            - event_date
    columns:
      - name: year
        description: "Schedule year"
        data_tests:
          - not_null

      - name: round_number
        description: "Grand Prix number"
        data_tests:
          - not_null

      - name: country
        description: "Country name of the Grand Prix event"
        data_tests:
          - not_null
          - not_empty

      - name: location
        description: "City name of the Grand Prix event"
        data_tests:
          - not_null
          - not_empty

      - name: official_event_name
        description: "Official name of the Grand Prix event"
        data_tests:
          - not_null
          - not_empty

      - name: event_date
        description: "Date of the Grand Prix event"
        data_tests:
          - not_null

      - name: event_name
        description: "Name of the Grand Prix event"
        data_tests:
          - not_null
          - not_empty

      - name: event_format
        description: "Format of the Grand Prix event (testing, conventional, sprint_qualifying)"
        data_tests:
          - not_null
          - not_empty

      - name: session_1
        description: "First session of the Grand Prix"
        data_tests:
          - not_null

      - name: session_1_date
        description: "Date of the first session of the Grand Prix"
        data_tests:
          - not_null

      - name: session_1_date_utc
        description: "Date of the first session of the Grand Prix (UTC Format)"
        data_tests:
          - not_null

      - name: session_1_date_brt
        description: "Date of the first session of the Grand Prix (BRT Format)"
        data_tests:
          - not_null

      - name: session_2
        description: "Second session of the Grand Prix"
        data_tests:
          - not_null

      - name: session_2_date
        description: "Date of the second session of the Grand Prix"
        data_tests:
          - not_null

      - name: session_2_date_utc
        description: "Date of the second session of the Grand Prix (UTC Format)"
        data_tests:
          - not_null

      - name: session_2_date_brt
        description: "Date of the second session of the Grand Prix (BRT Format)"
        data_tests:
          - not_null

      - name: session_3
        description: "Third session of the Grand Prix"
        data_tests:
          - not_null

      - name: session_3_date
        description: "Date of the third session of the Grand Prix"
        data_tests:
          - not_null

      - name: session_3_date_utc
        description: "Date of the third session of the Grand Prix (UTC Format)"
        data_tests:
          - not_null

      - name: session_3_date_brt
        description: "Date of the third session of the Grand Prix (BRT Format)"
        data_tests:
          - not_null

      - name: session_4
        description: "Fourth session of the Grand Prix"
        data_tests:
          - not_empty

      - name: session_4_date
        description: "Date of the fourth session of the Grand Prix"

      - name: session_4_date_utc
        description: "Date of the fourth session of the Grand Prix (UTC Format)"

      - name: session_4_date_brt
        description: "Date of the fourth session of the Grand Prix (BRT Format)"

      - name: session_5
        description: "Fifth session of the Grand Prix"
        data_tests:
          - not_empty

      - name: session_5_date
        description: "Date of the fifth session of the Grand Prix"

      - name: session_5_date_utc
        description: "Date of the fifth session of the Grand Prix (UTC Format)"

      - name: session_5_date_brt
        description: "Date of the fifth session of the Grand Prix (BRT Format)"

      - name: f1_api_support
        description: "Denotes whether this session is supported by the official F1 API"
        data_tests:
          - not_null

      - name: extracted_at
        description: "Data extraction date"
        data_tests:
          - not_null


  - name: stg_results
    description: "Driver results for all Formula 1 sessions"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - season_year
            - round_number
            - session_type
            - driver_number
    columns:
      - name: season_year
        description: "Schedule year"
        data_tests:
          - not_null

      - name: round_number
        description: "Grand Prix number"
        data_tests:
          - not_null

      - name: session_type
        description: "Session type code (e.g. 'FP1', 'FP2', 'FP3', 'Q', 'S', 'SQ', 'R')"
        data_tests:
          - not_null

      - name: driver_number
        description: "Driver number used during the session"
        data_tests:
          - not_null

      - name: broadcast_name
        description: "Driver name on the broadcast (e.g. 'M VERSTAPPEN')"
        data_tests:
          - not_null
          - not_empty

      - name: driver_abbreviation
        description: "Driver's name abbreviation (e.g. 'VER')"
        data_tests:
          - not_null

      - name: driver_id
        description: "Driver identifier"
        data_tests:
          - not_null
          - not_empty

      - name: team_name
        description: "Name of the Formula 1 Team driven by the driver during the session"
        data_tests:
          - not_empty

      - name: team_color
        description: "Color of the Formula 1 Team driven by the driver during the session"
        data_tests:
          - not_empty

      - name: team_id
        description: "Identifier of the Formula 1 Team driven by the driver during the session"
        data_tests:
          - not_null:
              config:
                where: "team_name IS NOT NULL"
          - not_empty

      - name: driver_first_name
        description: "Driver's first name"
        data_tests:
          - not_null
          - not_empty

      - name: driver_last_name
        description: "Driver's last name"
        data_tests:
          - not_null
          - not_empty

      - name: driver_full_name
        description: "Driver's full name (e.g. 'Max Verstappen')"
        data_tests:
          - not_null
          - not_empty

      - name: driver_headshot_url
        description: "Driver headshot URL"
        data_tests:
          - not_empty

      - name: driver_nationality
        description: "Country code of the driver's nationality (e.g. 'FRA')"
        data_tests:
          - not_empty

      - name: finishing_position
        description: "Driver's position at the end of the session (values only given if session is 'Race', 'Qualifying', 'Sprint', or 'Sprint Qualifying'). This additionally accounts for post-race penalties and disqualifications"

      - name: classified_position
        description: "The official classification result for each driver (values only given if session is 'Race' or 'Sprint'). This is either an integer value if the driver is officially classified or one of 'R' (retired), 'D' (disqualified), 'E' (excluded), 'W' (withdrawn), 'F' (failed to qualify) or 'N' (not classified)"
        data_tests:
          - not_empty

      - name: classification_status
        description: "The official classification result status for each driver (Classified, Retired, Disqualified, etc.)"
        data_tests:
          - accepted_values:
              values:
                - 'Classified'
                - 'Retired'
                - 'Diqualified'
                - 'Exluded'
                - 'Withdrawn'
                - 'Failed to Qualify'
                - 'Not Classified'
              config:
                where: "classification_status IS NOT NULL"

      - name: grid_position
        description: "Driver's position at the start of the session (values only given if session is 'Race' or 'Sprint')"

      - name: q1_time_seconds
        description: "The driver's best Q1 time in seconds (valid values only in qualifying sessions)"
        data_tests:
          - not_null_time

      - name: q2_time_seconds
        description: "The driver's best Q2 time in seconds (valid values only in qualifying sessions)"
        data_tests:
          - not_null_time

      - name: q3_time_seconds
        description: "The driver's best Q3 time in seconds (valid values only in qualifying sessions)"
        data_tests:
          - not_null_time

      - name: total_time_seconds
        description: "The driver's total race time in seconds (values only given if session is 'Race', 'Qualifying', 'Sprint', or 'Sprint Qualifying' and the driver was not more than one lap behind the leader)"
        data_tests:
          - not_null_time

      - name: status
        description: "A status message to indicate if and how the driver finished the race or to indicate the cause of a DNF. Possible values include but are not limited to 'Finished', '+ 1 Lap', 'Crash', 'Gearbox', …"
        data_tests:
          - not_empty

      - name: points
        description: "Points received by the driver for the finishing result"

      - name: laps_completed
        description: "The number of laps driven by the driver"

      - name: extracted_at
        description: "Data extraction date"
        data_tests:
          - not_null


  - name: stg_laps
    description: "Lap-by-lap data for each driver in every session"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: 
            - season_year
            - round_number
            - session_type
            - driver_number
            - lap_number
    columns:
      - name: season_year
        description: "Schedule year"
        data_tests:
          - not_null

      - name: round_number
        description: "Grand Prix number"
        data_tests:
          - not_null

      - name: session_type
        description: "Session type code"
        data_tests:
          - not_null

      - name: session_time_seconds
        description: "Session time when the lap was completed (in seconds)"
        data_tests:
          - not_null_time

      - name: driver
        description: "Driver's name abbreviation (e.g. 'VER')"
        data_tests:
          - not_null
          - not_empty

      - name: driver_number
        description: "Driver number used during the session"
        data_tests:
          - not_null

      - name: lap_time_seconds
        description: "Total lap time (in seconds)"
        data_tests:
          - not_null_time

      - name: lap_number
        description: "Lap number in the session"
        data_tests:
          - not_null

      - name: stint
        description: "Stint in which each lap was completed (1, 2, 3, etc.)"

      - name: pit_out_time_seconds
        description: "Session time when the car left the pit lane (in seconds)"
        data_tests:
          - not_null_time

      - name: pit_in_time_seconds
        description: "Session time when the car entered the pit lane (in seconds)"
        data_tests:
          - not_null_time

      - name: sector_1_time_seconds
        description: "Lap Sector 1 time (in seconds)"
        data_tests:
          - not_null_time

      - name: sector_2_time_seconds
        description: "Lap Sector 2 time (in seconds)"
        data_tests:
          - not_null_time

      - name: sector_3_time_seconds
        description: "Lap Sector 3 time (in seconds)"
        data_tests:
          - not_null_time

      - name: sector_1_session_time_seconds
        description: "Session time when Sector 1 was completed (in seconds)"
        data_tests:
          - not_null_time

      - name: sector_2_session_time_seconds
        description: "Session time when Sector 2 was completed (in seconds)"
        data_tests:
          - not_null_time

      - name: sector_3_session_time_seconds
        description: "Session time when Sector 3 was completed (in seconds)"
        data_tests:
          - not_null_time

      - name: speed_int_p1
        description: "Speed at intermediate point 1 (km/h)"

      - name: speed_int_p2
        description: "Speed at intermediate point 2 (km/h)"

      - name: speed_finish_line
        description: "Speed at finish line (km/h)"

      - name: speed_strap
        description: "Speed at speed trap (km/h)"

      - name: is_personal_best
        description: "Whether this lap is the driver's personal best of the session"

      - name: compound
        description: "Tire compound: 'SOFT', 'MEDIUM', 'HARD', 'INTERMEDIATE', 'WET'"
        data_tests:
          - accepted_values:
              values:
                - 'SOFT'
                - 'MEDIUM'
                - 'HARD'
                - 'INTERMEDIATE'
                - 'WET'
                - 'TEST_UNKNOWN'
                - 'UNKNOWN'
              config:
                where: "compound IS NOT NULL"

      - name: tyre_life
        description: "Number of laps completed on this set of tires"

      - name: fresh_tyre
        description: "Whether the tires are new"

      - name: team
        description: "Name of the Formula 1 Team driven by the driver during the session"
        data_tests:
          - not_empty

      - name: lap_start_time_seconds
        description: "Session time when the lap started (in seconds)"
        data_tests:
          - not_null_time

      - name: lap_start_datetime
        description: "Timestamp when the lap started"

      - name: track_status
        description: |
          Track status codes during the lap (FastF1):
          - **'1'**: Track clear (All clear)
          - **'2'**: Yellow flag
          - **'4'**: Safety Car
          - **'5'**: Red Flag
          - **'6'**: Virtual Safety Car deployed
          - **'7'**: Virtual Safety Car ending
          
          *Note: Multiple events can occur in the same lap (e.g. '24' to Yellow Flag + Safety Car).*
        data_tests:
          - not_null

      - name: is_all_track_clear
        description: "Whether this lap was completed entirely under clear track (Track status = '1')"
        data_tests:
          - not_null

      - name: is_track_clear
        description: "Whether track clear status occurred during this lap"
        data_tests:
          - not_null

      - name: has_yellow_flag
        description: "Whether yellow flag status occurred during this lap"
        data_tests:
          - not_null

      - name: has_safety_car
        description: "Whether safety car was deployed during this lap"
        data_tests:
          - not_null

      - name: has_red_flag
        description: "Whether red flag status occurred during this lap"
        data_tests:
          - not_null

      - name: has_vsc
        description: "Whether virtual safety car was deployed during this lap"
        data_tests:
          - not_null

      - name: track_status_description
        description: "Human-readable comma-separated description of all track statuses occurring during the lap"

      - name: position
        description: "Race position (for race/sprint sessions)"

      - name: deleted
        description: "Whether the lap time was deleted (track limits, etc.)"

      - name: deleted_reason
        description: "Reason the lap was deleted"
        data_tests:
          - not_empty

      - name: fast_f1_generated
        description: "Whether FastF1 generated this lap (e.g., for crashes)"
        data_tests:
          - not_null

      - name: is_accurate
        description: "Whether the lap timing is considered accurate"
        data_tests:
          - not_null

      - name: extracted_at
        description: "Data extraction date"
        data_tests:
          - not_null
