
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'f1_dbt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'f1_dbt'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  f1_dbt:
    staging:
      +materialized: view
      +schema: silver

    marts:
      +materialized: table
      core:
        +schema: gold
        fact_laps:
          +post-hook:
            - "CREATE INDEX IF NOT EXISTS idx_fact_laps_session_sk ON {{ this }} (session_sk)"
            - "CREATE INDEX IF NOT EXISTS idx_fact_laps_session_lap_time ON {{ this }} (session_sk, lap_time_seconds) WHERE lap_time_seconds IS NOT NULL"
            - "CREATE INDEX IF NOT EXISTS idx_fact_laps_speed_trap ON {{ this }} (session_sk, speed_trap) WHERE speed_trap IS NOT NULL"
        fact_results:
          +post-hook:
            - "CREATE INDEX IF NOT EXISTS idx_fact_results_session_sk ON {{ this }} (session_sk)"
        dim_sessions:
          +post-hook:
            - "CREATE INDEX IF NOT EXISTS idx_dim_sessions_event_sk ON {{ this }} (event_sk)"
        dim_schedule:
          +post-hook:
            - "CREATE INDEX IF NOT EXISTS idx_dim_schedule_circuit_sk ON {{ this }} (circuit_sk)"